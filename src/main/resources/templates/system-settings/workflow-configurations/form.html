<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(#{page.workflowConfiguration.title}, ~{::pageContent})}">
<body>
    <div th:fragment="pageContent">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <i class="bi bi-diagram-3"></i>
                <span th:if="${workflowConfiguration.id == null}"
                      th:text="'New ' + ${workflowConfigKindLabel} + ' configuration'"></span>
                <span th:if="${workflowConfiguration.id != null}"
                      th:text="'Edit ' + ${workflowConfigKindLabel} + ' configuration'"></span>
            </h2>
            <a th:href="@{/system-settings}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> <span th:text="#{button.backToSystemSettings}">Back to System settings</span>
            </a>
        </div>

        <form th:action="@{${workflowConfigBaseUrl + '/save'}}" method="post"
              th:object="${workflowConfiguration}">
            <input type="hidden" th:field="*{id}"/>
            <input type="hidden" th:field="*{defaultEntry}"/>

            <div class="mb-3">
                <label class="form-label" th:text="#{label.name}">Name</label>
                <input type="text" class="form-control" th:field="*{name}" required
                       th:readonly="${workflowConfiguration.defaultEntry}"/>
                <div class="form-text" th:if="${workflowConfiguration.defaultEntry}" th:text="#{help.workflow.defaultNotRenamed}">
                    The default workflow configuration cannot be renamed.
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> <span th:text="#{button.saveAndSelectWorkflows}">Save and select workflows</span>
                </button>
                <a th:href="@{/system-settings}" class="btn btn-outline-secondary" th:text="#{button.cancel}">Cancel</a>
            </div>
        </form>

    </div>
</body>
</html>
